name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Jfri.slnx
      - run: dotnet build Jfri.slnx --no-restore -c Release
      - run: dotnet test Jfri.slnx --no-build -c Release
      - run: docker build -t jfri:ci .
